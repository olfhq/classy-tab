<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ClassyTab</title>
<!-- Web Audio Synthesizer & MIDI Parser CDNs -->
<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: dark;
    /* Dark Archive: tonewoods & aged paper */
    --bg: #141312;
    --bg-2: #181716;
    --surface: #1e1c1a;
    --surface-2: #24211e;
    --reader-bg: #11100f;
    --border: #332f2b;
    --rule: #2b2825;
    --ivory: #f4efe6;
    --text: #e6dfd2;
    --muted: #9e9589;
    --faint: #6d665d;
    --brass: #c99a4e;
    --brass-hi: #d4a359;
    --brass-wash: rgba(201, 154, 78, 0.04);
    --brass-line: rgba(201, 154, 78, 0.45);
    --danger: #b9654a;
    --ok: #8fa874;
    --radius: 2px;

    --serif: 'Newsreader', 'Cormorant Garamond', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --ui: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --tab-font: 'JetBrains Mono', 'IBM Plex Mono', 'Cascadia Code', monospace;
    --frame-font-size: 14px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 14px;
    font-family: var(--ui);
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--brass); text-decoration: none; transition: color .15s; }
  a:hover { color: var(--brass-hi); }
  button { font-family: inherit; }
  :focus-visible { outline: 1px solid var(--brass); outline-offset: 2px; }
  ::selection { background: rgba(201, 154, 78, .3); color: var(--ivory); }

  /* Shared micro-label style */
  .micro {
    font-family: var(--ui);
    font-size: 11px; font-weight: 500;
    letter-spacing: .08em; text-transform: uppercase;
  }

  /* ---------- Scrollbars: invisible until hovered ---------- */
  * { scrollbar-width: thin; scrollbar-color: transparent transparent; }
  *:hover { scrollbar-color: #3d3731 transparent; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: transparent; border-radius: 0; }
  *:hover::-webkit-scrollbar-thumb { background: #3d3731; }
  *:hover::-webkit-scrollbar-thumb:hover { background: #554d44; }
  ::-webkit-scrollbar-corner { background: transparent; }

  /* ---------- Layout ---------- */
  .main-container { display: flex; gap: 12px; height: calc(100vh - 28px); }
  .left-column, .right-column {
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .left-column { flex: 1; }
  .right-column { flex: 1.45; }
  .main-container.focus-mode .left-column { display: none; }
  .main-container.focus-mode .right-column { flex: 1; width: 100%; }

  /* ---------- Left pane: catalogue header ---------- */
  .pane-header { padding: 22px 22px 14px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .brand { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; }
  h1 {
    margin: 0;
    font-family: var(--serif); font-weight: 500; font-size: 1.7rem; letter-spacing: -0.01em;
    color: var(--ivory); line-height: 1;
  }
  .brand-sub { font-family: var(--serif); font-style: italic; font-size: .9rem; color: var(--muted); }
  .result-count { margin-left: auto; color: var(--faint); font-variant-numeric: tabular-nums; }

  .search-wrap { position: relative; margin-bottom: 14px; }
  .search-wrap input[type="text"] {
    width: 100%;
    padding: 8px 0 8px;
    font-family: var(--serif); font-size: 1.05rem;
    color: var(--ivory);
    background: transparent;
    border: none; border-bottom: 1px solid var(--border);
    border-radius: 0;
    transition: border-color .2s;
  }
  .search-wrap input[type="text"]::placeholder { color: var(--faint); font-style: italic; }
  .search-wrap input[type="text"]:focus { outline: none; border-bottom-color: var(--brass); }

  .filters { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
  .tog { position: relative; cursor: pointer; user-select: none; }
  .tog input { position: absolute; opacity: 0; pointer-events: none; }
  .tog span {
    display: inline-block;
    padding: 4px 5px 3px;
    font-family: var(--ui); font-size: 11px; font-weight: 500;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--faint);
    border-bottom: 1px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .tog span::before { content: '[\00a0'; color: var(--faint); transition: color .15s; }
  .tog span::after  { content: '\00a0]'; color: var(--faint); transition: color .15s; }
  .tog:hover span { color: var(--muted); }
  .tog input:checked + span { color: var(--brass-hi); border-bottom-color: var(--brass-line); }
  .tog input:checked + span::before, .tog input:checked + span::after { color: var(--brass); }
  .tog input:focus-visible + span { outline: 1px solid var(--brass); outline-offset: 1px; }
  #clearBtn {
    margin-left: auto;
    padding: 4px 0 3px;
    font-family: var(--ui); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--faint); background: none; border: none; border-bottom: 1px solid transparent;
    cursor: pointer; transition: color .15s, border-color .15s;
  }
  #clearBtn:hover { color: var(--danger); border-bottom-color: var(--danger); }

  /* ---------- Catalogue table ---------- */
  #songTableContainer { flex: 1; min-height: 0; overflow: auto; }
  .song-table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
  .song-table th {
    position: sticky; top: 0; z-index: 2;
    padding: 10px 10px 8px;
    text-align: left;
    font-family: var(--ui); font-size: 10px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint);
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
  }
  .song-table th:nth-child(1) { width: 150px; padding-left: 22px; }
  .song-table th:nth-child(3), .song-table th:nth-child(4) { width: 46px; text-align: center; }
  .song-table th:nth-child(5), .song-table th:nth-child(6) { width: 44px; text-align: center; }
  .song-table td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--rule);
    vertical-align: middle;
    background: transparent;
    transition: background .15s;
  }
  .song-table td.author-cell {
    vertical-align: top;
    padding: 12px 10px 12px 22px;
    border-bottom: 1px solid var(--border);
    line-height: 1.25;
    word-wrap: break-word;
  }
  .author-cell .author-name { display: block; font-family: var(--serif); font-size: 1rem; font-weight: 500; color: var(--ivory); }
  .author-cell .years { display: block; margin-top: 3px; font-family: var(--ui); font-size: 10.5px; letter-spacing: .04em; color: var(--faint); font-variant-numeric: tabular-nums; }
  .song-table tr.author-row td { border-bottom: 1px solid var(--border); }
  .song-table tr:hover td:not(.author-cell) { background: var(--brass-wash); }
  .song-table tr.active td:not(.author-cell) { background: rgba(201, 154, 78, 0.08); box-shadow: inset 2px 0 0 var(--brass); }
  .song-table tr.active td:not(.author-cell):not(:first-child) { box-shadow: none; }
  .song-table tr.active .tab-link { color: var(--brass-hi); }
  .cell-center { text-align: center; }

  .title-cell { display: flex; align-items: center; gap: 6px; }
  .tab-link {
    flex: 1; min-width: 0;
    font-family: var(--serif); font-size: .98rem; line-height: 1.3;
    color: var(--text); white-space: normal; word-wrap: break-word;
  }
  .tab-link:hover { color: var(--brass-hi); }

  .bookmark-btn {
    flex-shrink: 0; width: 22px; height: 22px;
    display: grid; place-items: center; padding: 0;
    color: var(--faint); background: none; border: none; cursor: pointer;
    transition: color .15s, transform .1s;
  }
  .bookmark-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; transition: fill .15s; }
  .bookmark-btn:hover { color: var(--brass); }
  .bookmark-btn:active { transform: scale(.9); }
  .bookmark-btn.on { color: var(--brass); }
  .bookmark-btn.on svg { fill: currentColor; }

  /* Easy / LHF markers: a small brass lozenge */
  .flag {
    display: inline-block; width: 5px; height: 5px;
    background: var(--brass); transform: rotate(45deg);
  }
  /* MIDI / video marks: quiet typographic glyph links */
  .chip {
    display: inline-block;
    font-family: var(--ui); font-size: 12px; line-height: 1;
    color: var(--faint);
    padding: 3px 4px;
    border-bottom: 1px solid transparent;
    transition: color .15s, border-color .15s;
  }
  a.chip:hover { color: var(--brass-hi); border-bottom-color: var(--brass-line); }

  /* ---------- Viewer: the "cover page" ---------- */
  .viewer-header { padding: 22px 28px 0; background: var(--surface); border-bottom: 1px solid var(--border); }
  .viewer-meta { padding-bottom: 16px; }
  .content-frame-title {
    font-family: var(--serif); font-weight: 500; font-size: 1.85rem; line-height: 1.15; letter-spacing: -0.01em;
    color: var(--ivory);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .content-frame-title.placeholder { color: var(--faint); font-style: italic; font-size: 1.4rem; }
  .content-frame-composer {
    margin-top: 8px;
    font-family: var(--serif); font-style: italic; font-size: 1rem; color: var(--muted);
    min-height: 1.2em;
  }
  .content-frame-composer .sep { color: var(--faint); margin: 0 8px; font-style: normal; }
  .content-frame-composer .tuning { font-family: var(--ui); font-style: normal; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--brass); }

  .viewer-actions {
    display: flex; align-items: center; flex-wrap: wrap; gap: 2px 18px;
    padding: 9px 0;
    border-top: 1px solid var(--rule);
  }
  .btn-group { display: inline-flex; align-items: center; gap: 2px; }
  .btn-group .ctrl-btn { padding: 4px 6px; }

  /* Ghost text buttons */
  .ctrl-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 4px 0;
    font-family: var(--ui); font-size: 11px; font-weight: 500; line-height: 1.2;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
    background: none; border: none; border-bottom: 1px solid transparent; border-radius: 0;
    cursor: pointer; user-select: none; white-space: nowrap;
    transition: color .15s, border-color .15s, opacity .15s;
  }
  .ctrl-btn:hover:not(:disabled):not(.is-disabled) { color: var(--brass-hi); border-bottom-color: var(--brass-line); }
  .ctrl-btn:disabled, .ctrl-btn.is-disabled { opacity: .35; cursor: not-allowed; pointer-events: none; }
  .ctrl-btn.active { color: var(--brass-hi); border-bottom-color: var(--brass); }
  .ctrl-btn.flash { color: var(--ok); border-bottom-color: var(--ok); }
  .ctrl-btn.primary { color: var(--brass); border: 1px solid var(--brass-line); padding: 4px 10px; }
  .ctrl-btn.primary:hover:not(:disabled):not(.is-disabled) { background: rgba(201, 154, 78, .08); border-color: var(--brass); }
  .ctrl-btn svg { display: block; }
  .mini-btn { padding: 2px 7px; font-size: 14px; letter-spacing: 0; }
  .spacer { flex: 1; }

  /* ---------- MIDI strip ---------- */
  .midi-player-strip {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 8px 28px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    transition: opacity .2s;
  }
  .midi-player-strip.no-midi { opacity: .45; }
  .midi-controls-left, .midi-controls-right { display: flex; align-items: center; gap: 12px; }
  .midi-controls-center { flex: 1; min-width: 140px; display: flex; align-items: center; }
  .midi-time-display { font-family: var(--tab-font); font-size: 11px; color: var(--muted); user-select: none; font-variant-numeric: tabular-nums; }
  .midi-speed-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .midi-speed-select {
    padding: 2px 4px; font-family: var(--tab-font); font-size: 11px;
    color: var(--text); background: var(--bg-2);
    border: none; border-bottom: 1px solid var(--border); border-radius: 0; cursor: pointer;
  }
  .midi-speed-select:focus { outline: none; border-bottom-color: var(--brass); }
  .midi-speed-select:disabled { opacity: .5; cursor: not-allowed; }
  .midi-status-badge {
    font-family: var(--serif); font-style: italic; font-size: .85rem; color: var(--brass); white-space: nowrap;
  }
  .midi-player-strip.no-midi .midi-status-badge { color: var(--faint); }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    height: 1px; background: var(--border); outline: none; cursor: pointer;
  }
  .midi-player-strip input[type="range"] { width: 100%; }
  input[type="range"]:disabled { opacity: .4; cursor: not-allowed; }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 9px; height: 9px; background: var(--brass); border: none; border-radius: 0; transform: rotate(45deg);
    margin-top: 0;
  }
  input[type="range"]::-moz-range-thumb { width: 8px; height: 8px; background: var(--brass); border: none; border-radius: 0; }
  input[type="range"]::-moz-range-track { background: var(--border); height: 1px; }

  /* ---------- Score viewer ---------- */
  .content-frame-wrapper {
    flex: 1; min-height: 0; position: relative;
    display: flex; flex-direction: column;
    background: var(--reader-bg);
    /* gutter rule, like the left margin of a printed folio */
    background-image: linear-gradient(to right, transparent 33px, rgba(201, 154, 78, 0.10) 33px, rgba(201, 154, 78, 0.10) 34px, transparent 34px);
    overflow: hidden;
  }
  /* head & foot margin guidelines */
  .content-frame-wrapper::before, .content-frame-wrapper::after {
    content: ''; position: absolute; left: 0; right: 0; height: 1px;
    background: rgba(201, 154, 78, 0.10); pointer-events: none; z-index: 1;
  }
  .content-frame-wrapper::before { top: 14px; }
  .content-frame-wrapper::after { bottom: 14px; }
  .content-frame {
    flex: 1; min-height: 0; min-width: 0;
    padding: 28px 28px 90px 52px;
    overflow: auto;
    font-family: var(--tab-font);
    font-size: var(--frame-font-size);
    line-height: 1.3;
    color: #ddd5c6;
    /* Strictly preserve stave alignment: never wrap */
    white-space: pre;
    overflow-x: auto;
    tab-size: 8;
    font-variant-ligatures: none;
    font-feature-settings: "liga" 0, "calt" 0;
  }
  .reader-state {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    color: var(--faint); text-align: center; padding: 24px;
    pointer-events: none; z-index: 3;
    transition: opacity .2s;
  }
  .reader-state[data-state="loading"] { background: rgba(17, 16, 15, .8); }
  .reader-state[data-state="ready"] { opacity: 0; visibility: hidden; }
  .reader-state .empty-icon { color: var(--faint); opacity: .7; }
  .reader-state .spinner, .reader-state .empty-icon, .reader-state .state-text { display: none; }
  .reader-state[data-state="empty"] .empty-icon, .reader-state[data-state="empty"] .state-text { display: block; }
  .reader-state[data-state="loading"] .spinner { display: block; }
  .reader-state[data-state="loading"] .state-text { display: block; animation: pulse 1.6s ease-in-out infinite; }
  .state-text { font-family: var(--serif); font-style: italic; font-size: 1.05rem; color: var(--muted); }
  .spinner {
    width: 24px; height: 24px; border-radius: 50%;
    border: 1px solid var(--border); border-top-color: var(--brass);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

  /* ---------- Auto-scroll controls ---------- */
  .scroll-toolbar {
    position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center;
    width: max-content; max-width: calc(100% - 24px);
    padding: 8px 16px;
    background: rgba(30, 28, 26, 0.96);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 6px 22px rgba(0, 0, 0, .5);
    z-index: 10;
  }
  .speed-control-group { display: flex; align-items: center; gap: 8px; }
  .scroll-toolbar input[type="range"] { width: 90px; }
  .speed-display { font-family: var(--tab-font); font-size: 11px; min-width: 56px; color: var(--muted); text-align: right; }
  .countdown-label { display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: pointer; user-select: none; }
  .countdown-label input { accent-color: var(--brass); cursor: pointer; }
  .scroll-countdown {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 96px; height: 96px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-size: 3rem; font-weight: 400;
    color: var(--brass-hi);
    background: rgba(17, 16, 15, 0.94);
    border: 1px solid var(--brass);
    z-index: 20; pointer-events: none;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    body { padding: 8px; }
    .main-container { flex-direction: column; height: auto; }
    .left-column, .right-column { flex: none; height: 85vh; }
    .viewer-header, .midi-player-strip { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<div class="main-container">
  <!-- Left column: the catalogue -->
  <div class="left-column">
    <div class="pane-header">
      <div class="brand">
        <h1>ClassyTab</h1>
        <span class="brand-sub">an archive of classical guitar tablature</span>
        <span class="result-count micro" id="resultCount"></span>
      </div>
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Search composer, title or performer…" autocomplete="off" />
      </div>
      <div class="filters">
        <label class="tog"><input type="checkbox" id="easyCheckbox" /><span>Easy</span></label>
        <label class="tog"><input type="checkbox" id="lhfCheckbox" /><span>LHF</span></label>
        <label class="tog"><input type="checkbox" id="midiCheckbox" /><span>MIDI</span></label>
        <label class="tog"><input type="checkbox" id="videoCheckbox" /><span>Video</span></label>
        <label class="tog"><input type="checkbox" id="bookmarkCheckbox" /><span>★ Saved</span></label>
        <button id="clearBtn" type="button">Clear</button>
      </div>
    </div>

    <div id="songTableContainer">
      <table id="songTable" class="song-table"></table>
    </div>
  </div>

  <!-- Right column: the folio -->
  <div class="right-column">
    <div class="viewer-header">
      <div class="viewer-meta">
        <div id="contentFrameTitle" class="content-frame-title placeholder">Select a piece from the catalogue</div>
        <div id="contentFrameComposer" class="content-frame-composer"></div>
      </div>
      <div class="viewer-actions">
        <div class="btn-group" title="Score font size">
          <button id="zoomOutBtn" type="button" title="Decrease font size" class="ctrl-btn">−</button>
          <button id="zoomResetBtn" type="button" title="Reset font size" class="ctrl-btn">Font</button>
          <button id="zoomInBtn" type="button" title="Increase font size" class="ctrl-btn">+</button>
        </div>
        <button id="headerMidiBtn" type="button" class="ctrl-btn is-disabled" title="Play / pause MIDI">♫ Play MIDI</button>
        <a id="openTabLink" class="ctrl-btn is-disabled" target="_blank" rel="noopener" title="Open raw tab in a new window"><span>↗ Raw Tab</span></a>
        <button id="copyTabBtn" type="button" class="ctrl-btn is-disabled" title="Copy tab text"><span>Copy</span></button>
        <a id="midiDownloadLink" class="ctrl-btn is-disabled" download title="Download MIDI file"><span>↓ MIDI File</span></a>
        <span class="spacer"></span>
        <button id="focusModeBtn" type="button" title="Toggle Focus Mode (Esc to exit)" class="ctrl-btn primary">⤢ Focus</button>
      </div>
    </div>

    <!-- Pinned MIDI control strip -->
    <div id="midiPlayerStrip" class="midi-player-strip no-midi">
      <div class="midi-controls-left">
        <button id="midiPlayBtn" type="button" class="ctrl-btn" title="Play MIDI" disabled>▶ Play</button>
        <button id="midiPauseBtn" type="button" class="ctrl-btn" title="Pause MIDI" disabled>⏸ Pause</button>
        <button id="midiStopBtn" type="button" class="ctrl-btn" title="Stop MIDI" disabled>⏹ Stop</button>
        <span class="midi-time-display">
          <span id="midiCurrentTime">0:00</span> / <span id="midiTotalDuration">0:00</span>
        </span>
      </div>
      <div class="midi-controls-center">
        <input type="range" id="midiScrubber" min="0" max="100" value="0" step="0.1" title="Seek" disabled />
      </div>
      <div class="midi-controls-right">
        <label for="midiSpeedSelect" class="midi-speed-label">Tempo</label>
        <select id="midiSpeedSelect" class="midi-speed-select" disabled>
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1.0" selected>1.0x</option>
          <option value="1.25">1.25x</option>
        </select>
        <span id="midiStatusBadge" class="midi-status-badge">No MIDI available</span>
      </div>
    </div>

    <div class="content-frame-wrapper">
      <div id="contentFrame" class="content-frame"></div>
      <div id="readerState" class="reader-state" data-state="empty">
        <svg class="empty-icon" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <div class="spinner"></div>
        <div class="state-text" id="readerStateText">Select a piece to open its tablature</div>
      </div>
      <div id="scrollCountdown" class="scroll-countdown" style="display: none;"></div>
      <div class="scroll-toolbar" id="scrollToolbar">
        <button id="scrollPlayBtn" type="button" class="ctrl-btn primary" title="Toggle Auto-Scroll (Space)">▶ Play</button>
        <div class="speed-control-group">
          <button id="speedDownBtn" type="button" class="ctrl-btn mini-btn" title="Decrease speed ([)">−</button>
          <input type="range" id="scrollSpeedSlider" min="5" max="120" value="25" step="1" title="Scroll Speed" />
          <button id="speedUpBtn" type="button" class="ctrl-btn mini-btn" title="Increase speed (])">+</button>
          <span id="speedValueDisplay" class="speed-display">25 px/s</span>
        </div>
        <label class="countdown-label" title="3-second countdown before scrolling">
          <input type="checkbox" id="countdownCheckbox" checked /> 3s lead-in
        </label>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { songsData } from './songs_data.js';
  const mainContainer = document.querySelector('.main-container');
  const searchInput = document.getElementById('searchInput');
  const easyCheckbox = document.getElementById('easyCheckbox');
  const lhfCheckbox = document.getElementById('lhfCheckbox');
  const midiCheckbox = document.getElementById('midiCheckbox');
  const videoCheckbox = document.getElementById('videoCheckbox');
  const bookmarkCheckbox = document.getElementById('bookmarkCheckbox');
  const clearBtn = document.getElementById('clearBtn');
  const songTable = document.getElementById('songTable');
  const contentFrame = document.getElementById('contentFrame');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomResetBtn = document.getElementById('zoomResetBtn');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const focusModeBtn = document.getElementById('focusModeBtn');
  const scrollPlayBtn = document.getElementById('scrollPlayBtn');
  const speedDownBtn = document.getElementById('speedDownBtn');
  const speedUpBtn = document.getElementById('speedUpBtn');
  const scrollSpeedSlider = document.getElementById('scrollSpeedSlider');
  const speedValueDisplay = document.getElementById('speedValueDisplay');
  const countdownCheckbox = document.getElementById('countdownCheckbox');
  const scrollCountdown = document.getElementById('scrollCountdown');
  const resultCount = document.getElementById('resultCount');
  const readerState = document.getElementById('readerState');
  const readerStateText = document.getElementById('readerStateText');
  const contentFrameTitle = document.getElementById('contentFrameTitle');
  const contentFrameComposer = document.getElementById('contentFrameComposer');
  const copyTabBtn = document.getElementById('copyTabBtn');
  const openTabLink = document.getElementById('openTabLink');
  const midiDownloadLink = document.getElementById('midiDownloadLink');
  const headerMidiBtn = document.getElementById('headerMidiBtn');

  // Header "Play MIDI" proxies to the pinned MIDI strip controls
  headerMidiBtn.addEventListener('click', () => {
    if (!midiPauseBtn.disabled) midiPauseBtn.click();
    else if (!midiPlayBtn.disabled) midiPlayBtn.click();
  });
  function syncHeaderMidi(state) {
    const off = state === 'no-midi' || state === 'loading' || state === 'error';
    headerMidiBtn.classList.toggle('is-disabled', off);
    headerMidiBtn.classList.toggle('active', state === 'playing');
    headerMidiBtn.textContent = state === 'playing' ? '♫ Pause MIDI' : '♫ Play MIDI';
  }

  // Look for tuning notes in the head of a tab
  function detectTuning(text) {
    const head = text.split('\n').slice(0, 60).join('\n');
    const m = head.match(/\b(drop(?:ped)?\s*[a-g][#b]?|dadgbe|other tuning|tuning\s*[:=]?\s*[^\n]{3,40})/i);
    return m ? m[0].trim().replace(/\s+/g, ' ') : '';
  }
  function renderSubtitle(song, tuning) {
    contentFrameComposer.textContent = '';
    const parts = [];
    if (song && song.author) parts.push(song.author + (song.author_years ? ' ' + song.author_years : ''));
    parts.forEach(p => contentFrameComposer.appendChild(document.createTextNode(p)));
    if (tuning) {
      if (parts.length) {
        const sep = document.createElement('span');
        sep.className = 'sep';
        sep.textContent = '·';
        contentFrameComposer.appendChild(sep);
      }
      const t = document.createElement('span');
      t.className = 'tuning';
      t.textContent = tuning;
      contentFrameComposer.appendChild(t);
    }
  }

  const STAR_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
  const YT_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4" fill="currentColor"/><path d="M10 9l5 3-5 3z" fill="#16181d"/></svg>';
  const MIDI_SVG = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';

  let currentTabFile = null;
  let loadToken = 0;

  // Pinned MIDI player element references
  const midiPlayerStrip = document.getElementById('midiPlayerStrip');
  const midiPlayBtn = document.getElementById('midiPlayBtn');
  const midiPauseBtn = document.getElementById('midiPauseBtn');
  const midiStopBtn = document.getElementById('midiStopBtn');
  const midiCurrentTime = document.getElementById('midiCurrentTime');
  const midiTotalDuration = document.getElementById('midiTotalDuration');
  const midiScrubber = document.getElementById('midiScrubber');
  const midiSpeedSelect = document.getElementById('midiSpeedSelect');
  const midiStatusBadge = document.getElementById('midiStatusBadge');

  // Font zoom controls and persistence
  const DEFAULT_FONT_SIZE = 14;
  let currentFontSize = parseInt(localStorage.getItem('classytab_fontsize') || localStorage.getItem('classtab_fontsize'), 10) || DEFAULT_FONT_SIZE;

  function applyFontSize(size) {
    currentFontSize = Math.max(8, Math.min(36, size));
    contentFrame.style.fontSize = `${currentFontSize}px`;
    localStorage.setItem('classytab_fontsize', currentFontSize);
  }
  applyFontSize(currentFontSize);

  zoomOutBtn.addEventListener('click', () => applyFontSize(currentFontSize - 1));
  zoomInBtn.addEventListener('click', () => applyFontSize(currentFontSize + 1));
  zoomResetBtn.addEventListener('click', () => applyFontSize(DEFAULT_FONT_SIZE));

  // Focus Mode
  function setFocusMode(enable) {
    if (enable) {
      mainContainer.classList.add('focus-mode');
      focusModeBtn.textContent = '⤢ Exit (Esc)';
      focusModeBtn.classList.add('active');
    } else {
      mainContainer.classList.remove('focus-mode');
      focusModeBtn.textContent = '⤢ Focus';
      focusModeBtn.classList.remove('active');
    }
  }

  focusModeBtn.addEventListener('click', () => {
    const isFocus = mainContainer.classList.contains('focus-mode');
    setFocusMode(!isFocus);
  });

  // Auto-Scroll Engine
  let isScrolling = false;
  let scrollSpeed = parseInt(localStorage.getItem('classytab_scroll_speed') || localStorage.getItem('classtab_scroll_speed'), 10) || 25; // px/sec
  let lastTimestamp = null;
  let animFrameId = null;
  let countdownTimer = null;

  function updateScrollSpeed(newSpeed) {
    scrollSpeed = Math.max(5, Math.min(120, newSpeed));
    scrollSpeedSlider.value = scrollSpeed;
    speedValueDisplay.textContent = `${scrollSpeed} px/s`;
    localStorage.setItem('classytab_scroll_speed', scrollSpeed);
  }
  updateScrollSpeed(scrollSpeed);

  scrollSpeedSlider.addEventListener('input', () => {
    updateScrollSpeed(parseInt(scrollSpeedSlider.value, 10));
  });
  speedDownBtn.addEventListener('click', () => updateScrollSpeed(scrollSpeed - 5));
  speedUpBtn.addEventListener('click', () => updateScrollSpeed(scrollSpeed + 5));

  function stepScroll(timestamp) {
    if (!isScrolling) return;
    if (lastTimestamp !== null) {
      const deltaSec = (timestamp - lastTimestamp) / 1000;
      contentFrame.scrollTop += scrollSpeed * deltaSec;
      if (contentFrame.scrollTop + contentFrame.clientHeight >= contentFrame.scrollHeight - 1) {
        stopAutoScroll();
        return;
      }
    }
    lastTimestamp = timestamp;
    animFrameId = requestAnimationFrame(stepScroll);
  }

  function startScrollEngine() {
    isScrolling = true;
    lastTimestamp = null;
    scrollPlayBtn.textContent = '⏸ Pause';
    scrollPlayBtn.classList.add('active');
    animFrameId = requestAnimationFrame(stepScroll);
  }

  function cancelCountdown() {
    if (countdownTimer) {
      clearInterval(countdownTimer);
      countdownTimer = null;
    }
    scrollCountdown.style.display = 'none';
  }

  function stopAutoScroll() {
    isScrolling = false;
    cancelCountdown();
    if (animFrameId) {
      cancelAnimationFrame(animFrameId);
      animFrameId = null;
    }
    lastTimestamp = null;
    scrollPlayBtn.textContent = '▶ Play';
    scrollPlayBtn.classList.remove('active');
  }

  function toggleAutoScroll() {
    const text = contentFrame.textContent ? contentFrame.textContent.trim() : '';
    if (!text || text.startsWith('Select a song') || text.startsWith('Error loading')) {
      return;
    }

    if (isScrolling || countdownTimer) {
      stopAutoScroll();
    } else {
      if (countdownCheckbox.checked) {
        let count = 3;
        scrollCountdown.textContent = count;
        scrollCountdown.style.display = 'flex';
        scrollPlayBtn.textContent = '⏳ Ready...';
        countdownTimer = setInterval(() => {
          count--;
          if (count > 0) {
            scrollCountdown.textContent = count;
          } else {
            cancelCountdown();
            startScrollEngine();
          }
        }, 1000);
      } else {
        startScrollEngine();
      }
    }
  }

  scrollPlayBtn.addEventListener('click', toggleAutoScroll);

  // Global Keyboard & Pedal Shortcuts
  document.addEventListener('keydown', e => {
    const isInputFocused = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');

    // Escape exits Focus Mode
    if (e.key === 'Escape') {
      if (mainContainer.classList.contains('focus-mode')) {
        setFocusMode(false);
      }
      return;
    }

    if (isInputFocused) return;

    // Spacebar toggles auto-scroll
    if (e.code === 'Space' || e.key === ' ') {
      const text = contentFrame.textContent ? contentFrame.textContent.trim() : '';
      if (text && !text.startsWith('Select a song') && !text.startsWith('Error loading')) {
        e.preventDefault();
        toggleAutoScroll();
      }
      return;
    }

    // [ to decrease speed
    if (e.key === '[') {
      e.preventDefault();
      updateScrollSpeed(scrollSpeed - 5);
      return;
    }

    // ] to increase speed
    if (e.key === ']') {
      e.preventDefault();
      updateScrollSpeed(scrollSpeed + 5);
      return;
    }

    // PageDown / PageUp for Bluetooth/USB foot pedals
    if (e.key === 'PageDown') {
      e.preventDefault();
      contentFrame.scrollBy({ top: contentFrame.clientHeight * 0.8, behavior: 'smooth' });
      return;
    }
    if (e.key === 'PageUp') {
      e.preventDefault();
      contentFrame.scrollBy({ top: -contentFrame.clientHeight * 0.8, behavior: 'smooth' });
      return;
    }
  });

  let debounceTimer = null;
  function debouncedFilterSongs() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      filterSongs();
    }, 150);
  }

  // Helper to identify a song uniquely
  function getSongId(song) {
    return `${song.author}-${song.title}`;
  }

  // Load bookmarks from localStorage
  function getBookmarks() {
    const stored = localStorage.getItem('classytab_bookmarks') || localStorage.getItem('classtab_bookmarks');
    return stored ? new Set(JSON.parse(stored)) : new Set();
  }

  // Save bookmarks to localStorage
  function saveBookmarks(bookmarks) {
    localStorage.setItem('classytab_bookmarks', JSON.stringify(Array.from(bookmarks)));
  }

  // Toggle a song's bookmark status
  function toggleBookmark(song) {
    const bookmarks = getBookmarks();
    const songId = getSongId(song);
    if (bookmarks.has(songId)) {
      bookmarks.delete(songId);
    } else {
      bookmarks.add(songId);
    }
    saveBookmarks(bookmarks);
    filterSongs();
  }

  function filterSongs() {
    const text = searchInput.value.trim().toLowerCase().replace(/<[^>]*>/g, '');
    const showEasy = easyCheckbox.checked;
    const showLhf = lhfCheckbox.checked;
    const showMidi = midiCheckbox.checked;
    const showVideo = videoCheckbox.checked;
    const showBookmarks = bookmarkCheckbox.checked;
    const bookmarks = getBookmarks();

    const filtered = songsData.filter(song => {
      if (!song.author) return false;
      const songId = getSongId(song);
      const isBookmarked = bookmarks.has(songId);

      let ok = true;
      if (text) {
        const plainAuthor = (song.author || '').replace(/<[^>]*>/g, '').toLowerCase();
        const plainTitle = (song.title || '').replace(/<[^>]*>/g, '').toLowerCase();
        const plainArtist = (song.artist || '').replace(/<[^>]*>/g, '').toLowerCase();
        ok = plainAuthor.includes(text) || plainTitle.includes(text) || plainArtist.includes(text);
      }
      if (ok && showEasy) ok = song.easy === true;
      if (ok && showLhf) ok = song.lhf === true;
      if (ok && showMidi) ok = Boolean(song.midi && song.midi.trim().length > 0);
      if (ok && showVideo) ok = Boolean(song.video && song.video.trim().length > 0);
      if (ok && showBookmarks) ok = isBookmarked;
      return ok;
    });
    renderSongs(filtered);
  }

  function renderSongs(songs) {
    songTable.innerHTML = '';
    resultCount.textContent = `${songs.length.toLocaleString()} piece${songs.length === 1 ? '' : 's'}`;
    // Add table header – reordered columns
    const header = document.createElement('tr');
    ['Composer', 'Title', 'Easy', 'LHF', 'MID', 'Vid'].forEach(text => {
      const th = document.createElement('th');
      th.textContent = text;
      header.appendChild(th);
    });
    songTable.appendChild(header);

    // Group by author
    const groups = {};
    songs.forEach(song => {
      const key = song.author;
      if (!groups[key]) groups[key] = [];
      groups[key].push(song);
    });

    Object.keys(groups).sort().forEach(author => {
      const list = groups[author];
      const rowspan = list.length;
      list.forEach((song, idx) => {
        const tr = document.createElement('tr');
        if (song.tab === currentTabFile) tr.classList.add('active');
        if (idx === 0) {
          const tdAuthor = document.createElement('td');
          tdAuthor.rowSpan = rowspan;
          const nameEl = document.createElement('span');
          nameEl.className = 'author-name';
          nameEl.innerHTML = author;
          tdAuthor.appendChild(nameEl);
          const yearsRaw = (list.find(s => s.author_years) || {}).author_years;
          if (yearsRaw) {
            const yearsEl = document.createElement('span');
            yearsEl.className = 'years';
            yearsEl.textContent = yearsRaw.replace(/[()]/g, '').replace(/-/g, '–');
            tdAuthor.appendChild(yearsEl);
          }
          tdAuthor.classList.add('author-cell');
          tr.appendChild(tdAuthor);
        }
        // Add border class to the last row of each author group
        if (idx === list.length - 1) {
          tr.classList.add('author-row');
        }

        // Title column with bookmark button
        const tdTitle = document.createElement('td');
        const tdTitleCellContent = document.createElement('div');
        tdTitleCellContent.classList.add('title-cell');
        const songId = getSongId(song);
        const bookmarks = getBookmarks();

        const bookmarkBtn = document.createElement('button');
        bookmarkBtn.classList.add('bookmark-btn');
        bookmarkBtn.type = 'button';
        const isBookmarked = bookmarks.has(songId);
        bookmarkBtn.classList.toggle('on', isBookmarked);
        bookmarkBtn.setAttribute('aria-pressed', String(isBookmarked));
        bookmarkBtn.title = isBookmarked ? 'Remove bookmark' : 'Add bookmark';
        bookmarkBtn.innerHTML = STAR_SVG;
        bookmarkBtn.onclick = (e) => {
          e.stopPropagation();
          toggleBookmark(song);
        };
        tdTitleCellContent.appendChild(bookmarkBtn);

        const link = document.createElement('a');
        link.href = '#';
        link.className = 'tab-link';
        link.textContent = song.title;
        link.onclick = (e) => {
          e.preventDefault();
          loadTabContent(song.title, song.tab, song.midi, song, tr);
        };
        tdTitleCellContent.appendChild(link);
        tdTitle.appendChild(tdTitleCellContent);

        tr.appendChild(tdTitle);

        // Easy column
        const tdEasy = document.createElement('td');
        tdEasy.classList.add('easy-cell', 'cell-center');
        if (song.easy) tdEasy.innerHTML = '<span class="flag" title="Easy"></span>';
        tr.appendChild(tdEasy);

        // LHF column
        const tdLhf = document.createElement('td');
        tdLhf.classList.add('lhf-cell', 'cell-center');
        if (song.lhf) tdLhf.innerHTML = '<span class="flag" title="Left-hand fingering"></span>';
        tr.appendChild(tdLhf);

        // MIDI column
        const tdMidi = document.createElement('td');
        tdMidi.classList.add('cell-center');
        if (song.midi && song.midi.trim().length > 0) {
          const midiLink = document.createElement('a');
          midiLink.href = 'midi/' + song.midi.trim();
          midiLink.target = '_blank';
          midiLink.className = 'chip';
          midiLink.title = 'Open MIDI file';
          midiLink.textContent = '♫';
          tdMidi.appendChild(midiLink);
        }
        tr.appendChild(tdMidi);

        // Video column
        const tdVideo = document.createElement('td');
        tdVideo.classList.add('cell-center');
        if (song.video) {
          const vidLink = document.createElement('a');
          vidLink.href = song.video;
          vidLink.target = '_blank';
          vidLink.rel = 'noopener';
          vidLink.className = 'chip yt';
          vidLink.textContent = '▶';
          vidLink.title = song.artist ? `Watch: ${song.artist}` : 'Watch video';
          tdVideo.appendChild(vidLink);
        }
        tr.appendChild(tdVideo);

        songTable.appendChild(tr);
      });
    });
  }

  // Initial render all
  renderSongs(songsData);

  searchInput.addEventListener('input', debouncedFilterSongs);
  searchInput.addEventListener('keyup', e => {
    if (e.key === 'Enter') {
      clearTimeout(debounceTimer);
      filterSongs();
    }
  });
  easyCheckbox.addEventListener('change', debouncedFilterSongs);
  lhfCheckbox.addEventListener('change', debouncedFilterSongs);
  midiCheckbox.addEventListener('change', debouncedFilterSongs);
  videoCheckbox.addEventListener('change', debouncedFilterSongs);
  bookmarkCheckbox.addEventListener('change', debouncedFilterSongs);
  clearBtn.addEventListener('click', () => {
    clearTimeout(debounceTimer);
    searchInput.value = '';
    easyCheckbox.checked = false;
    lhfCheckbox.checked = false;
    midiCheckbox.checked = false;
    videoCheckbox.checked = false;
    bookmarkCheckbox.checked = false;
    renderSongs(songsData);
  });
  // Helper for formatting time (mm:ss)
  function formatTime(seconds) {
    if (isNaN(seconds) || seconds < 0) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  // Web Audio Synthesizer State
  let isSoundfontLoaded = false;
  let guitarSampler = null;
  let fallbackSynth = null;
  let currentMidi = null;
  let midiNotes = [];
  let isMidiPlaying = false;
  let midiSongPosition = 0;
  let midiSongDuration = 0;
  let midiPlaybackSpeed = 1.0;
  let midiNoteIndex = 0;
  let lastAudioContextTime = 0;
  let midiSchedulerTimer = null;
  let midiAbortController = null;

  function ensureAudioInstruments() {
    if (fallbackSynth) return;
    try {
      fallbackSynth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: 'triangle' },
        envelope: { attack: 0.005, decay: 0.6, sustain: 0.1, release: 0.8 }
      }).toDestination();
      fallbackSynth.volume.value = -6;

      guitarSampler = new Tone.Sampler({
        urls: {
          E2: "E2.mp3",
          A2: "A2.mp3",
          D3: "D3.mp3",
          G3: "G3.mp3",
          B3: "B3.mp3",
          E4: "E4.mp3",
          A4: "A4.mp3",
          E5: "E5.mp3"
        },
        baseUrl: "https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/acoustic_guitar_nylon-mp3/",
        onload: () => {
          isSoundfontLoaded = true;
          if (currentMidi && isMidiPlaying) {
            midiStatusBadge.textContent = 'Playing (Nylon Guitar)';
          } else if (currentMidi) {
            midiStatusBadge.textContent = 'Nylon Guitar Ready';
          }
        }
      }).toDestination();
    } catch (e) {
      console.warn('Audio instrument initialization error:', e);
    }
  }

  function setMidiPlayerState(state) {
    _applyMidiState(state);
    syncHeaderMidi(state);
  }
  function _applyMidiState(state) {
    if (state === 'no-midi') {
      midiPlayerStrip.classList.add('no-midi');
      midiPlayBtn.disabled = true;
      midiPauseBtn.disabled = true;
      midiStopBtn.disabled = true;
      midiScrubber.disabled = true;
      midiSpeedSelect.disabled = true;
      midiCurrentTime.textContent = '0:00';
      midiTotalDuration.textContent = '0:00';
      midiScrubber.value = 0;
      midiStatusBadge.textContent = 'No MIDI available';
    } else if (state === 'loading') {
      midiPlayerStrip.classList.remove('no-midi');
      midiPlayBtn.disabled = true;
      midiPauseBtn.disabled = true;
      midiStopBtn.disabled = true;
      midiScrubber.disabled = true;
      midiSpeedSelect.disabled = true;
      midiStatusBadge.textContent = 'Loading MIDI...';
    } else if (state === 'ready') {
      midiPlayerStrip.classList.remove('no-midi');
      midiPlayBtn.disabled = false;
      midiPauseBtn.disabled = true;
      midiStopBtn.disabled = false;
      midiScrubber.disabled = false;
      midiSpeedSelect.disabled = false;
      midiStatusBadge.textContent = isSoundfontLoaded ? 'Nylon Guitar Ready' : 'Synthesizer Ready';
    } else if (state === 'playing') {
      midiPlayerStrip.classList.remove('no-midi');
      midiPlayBtn.disabled = true;
      midiPauseBtn.disabled = false;
      midiStopBtn.disabled = false;
      midiScrubber.disabled = false;
      midiSpeedSelect.disabled = false;
      midiStatusBadge.textContent = isSoundfontLoaded ? 'Playing (Nylon Guitar)' : 'Playing (Synthesizer)';
    } else if (state === 'paused') {
      midiPlayerStrip.classList.remove('no-midi');
      midiPlayBtn.disabled = false;
      midiPauseBtn.disabled = true;
      midiStopBtn.disabled = false;
      midiScrubber.disabled = false;
      midiSpeedSelect.disabled = false;
      midiStatusBadge.textContent = 'Paused';
    } else if (state === 'error') {
      midiPlayerStrip.classList.add('no-midi');
      midiPlayBtn.disabled = true;
      midiPauseBtn.disabled = true;
      midiStopBtn.disabled = true;
      midiScrubber.disabled = true;
      midiSpeedSelect.disabled = true;
      midiStatusBadge.textContent = 'MIDI unavailable';
    }
  }

  function cleanupMidiPlayback() {
    if (midiSchedulerTimer) {
      clearInterval(midiSchedulerTimer);
      midiSchedulerTimer = null;
    }
    isMidiPlaying = false;
    if (guitarSampler) {
      try { guitarSampler.releaseAll(); } catch (_) {}
    }
    if (fallbackSynth) {
      try { fallbackSynth.releaseAll(); } catch (_) {}
    }
  }

  function stopMidiPlayback() {
    cleanupMidiPlayback();
    midiSongPosition = 0;
    midiScrubber.value = 0;
    midiCurrentTime.textContent = '0:00';
    if (currentMidi) {
      setMidiPlayerState('ready');
    } else {
      setMidiPlayerState('no-midi');
    }
  }

  async function loadMidiForSong(midiFile) {
    stopMidiPlayback();
    currentMidi = null;
    midiNotes = [];
    midiSongDuration = 0;

    if (midiAbortController) {
      midiAbortController.abort();
      midiAbortController = null;
    }

    if (!midiFile || !midiFile.trim()) {
      setMidiPlayerState('no-midi');
      return;
    }

    const cleanMidi = midiFile.trim();
    const midiPath = 'midi/' + cleanMidi;
    setMidiPlayerState('loading');

    try {
      midiAbortController = new AbortController();
      const res = await fetch(midiPath, { signal: midiAbortController.signal });
      if (!res.ok) throw new Error('MIDI file not found');
      const arrayBuffer = await res.arrayBuffer();
      currentMidi = new Midi(arrayBuffer);

      midiNotes = [];
      currentMidi.tracks.forEach(track => {
        track.notes.forEach(note => {
          midiNotes.push({
            name: note.name,
            time: note.time,
            duration: note.duration,
            velocity: note.velocity || 0.8
          });
        });
      });
      midiNotes.sort((a, b) => a.time - b.time);

      midiSongDuration = currentMidi.duration || 0;
      midiScrubber.max = midiSongDuration;
      midiScrubber.value = 0;
      midiCurrentTime.textContent = '0:00';
      midiTotalDuration.textContent = formatTime(midiSongDuration);
      setMidiPlayerState('ready');
    } catch (err) {
      if (err.name === 'AbortError') return;
      console.warn('Failed to load MIDI:', err);
      setMidiPlayerState('error');
    }
  }

  midiPlayBtn.addEventListener('click', async () => {
    if (!currentMidi || midiNotes.length === 0) return;
    try {
      await Tone.start();
    } catch (_) {}
    ensureAudioInstruments();

    isMidiPlaying = true;
    lastAudioContextTime = Tone.now();
    setMidiPlayerState('playing');

    midiNoteIndex = midiNotes.findIndex(n => n.time >= midiSongPosition);
    if (midiNoteIndex === -1) midiNoteIndex = midiNotes.length;

    if (midiSchedulerTimer) clearInterval(midiSchedulerTimer);
    midiSchedulerTimer = setInterval(() => {
      if (!isMidiPlaying) return;
      const now = Tone.now();
      const delta = (now - lastAudioContextTime) * midiPlaybackSpeed;
      lastAudioContextTime = now;
      midiSongPosition += delta;

      if (midiSongPosition >= midiSongDuration) {
        stopMidiPlayback();
        return;
      }

      midiScrubber.value = midiSongPosition;
      midiCurrentTime.textContent = formatTime(midiSongPosition);

      const lookahead = 0.12 * midiPlaybackSpeed;
      while (midiNoteIndex < midiNotes.length && midiNotes[midiNoteIndex].time <= midiSongPosition + lookahead) {
        const note = midiNotes[midiNoteIndex];
        const delayInSong = Math.max(0, note.time - midiSongPosition);
        const audioTime = now + (delayInSong / midiPlaybackSpeed);
        const dur = Math.max(0.05, note.duration / midiPlaybackSpeed);
        const inst = (isSoundfontLoaded && guitarSampler) ? guitarSampler : fallbackSynth;
        if (inst) {
          try {
            inst.triggerAttackRelease(note.name, dur, audioTime, note.velocity);
          } catch (_) {}
        }
        midiNoteIndex++;
      }
    }, 25);
  });

  midiPauseBtn.addEventListener('click', () => {
    if (!isMidiPlaying) return;
    cleanupMidiPlayback();
    setMidiPlayerState('paused');
  });

  midiStopBtn.addEventListener('click', () => {
    stopMidiPlayback();
  });

  midiScrubber.addEventListener('input', () => {
    midiSongPosition = parseFloat(midiScrubber.value);
    midiCurrentTime.textContent = formatTime(midiSongPosition);
    if (guitarSampler) try { guitarSampler.releaseAll(); } catch (_) {}
    if (fallbackSynth) try { fallbackSynth.releaseAll(); } catch (_) {}
    midiNoteIndex = midiNotes.findIndex(n => n.time >= midiSongPosition);
    if (midiNoteIndex === -1) midiNoteIndex = midiNotes.length;
    lastAudioContextTime = Tone.now();
  });

  midiSpeedSelect.addEventListener('change', () => {
    midiPlaybackSpeed = parseFloat(midiSpeedSelect.value) || 1.0;
  });

  function setReaderState(state, text) {
    readerState.dataset.state = state;
    if (text) readerStateText.textContent = text;
  }

  function setActionLinks(tabFile, midiFile) {
    openTabLink.href = 'tabs/' + tabFile;
    openTabLink.classList.remove('is-disabled');
    copyTabBtn.classList.remove('is-disabled');
    if (midiFile && midiFile.trim()) {
      midiDownloadLink.href = 'midi/' + midiFile.trim();
      midiDownloadLink.classList.remove('is-disabled');
    } else {
      midiDownloadLink.removeAttribute('href');
      midiDownloadLink.classList.add('is-disabled');
    }
  }

  copyTabBtn.addEventListener('click', async () => {
    const text = contentFrame.textContent;
    if (!text) return;
    const label = copyTabBtn.querySelector('span');
    try {
      await navigator.clipboard.writeText(text);
      label.textContent = 'Copied';
    } catch (_) {
      label.textContent = 'Failed';
    }
    copyTabBtn.classList.add('flash');
    setTimeout(() => { label.textContent = 'Copy'; copyTabBtn.classList.remove('flash'); }, 1400);
  });

  // Load tab content into the right‑hand frame
  async function loadTabContent(title, tabFile, midiFile, song, rowEl) {
    stopAutoScroll();
    contentFrame.scrollTop = 0;
    contentFrame.scrollLeft = 0;
    loadMidiForSong(midiFile);

    const token = ++loadToken;
    currentTabFile = tabFile;
    songTable.querySelectorAll('tr.active').forEach(r => r.classList.remove('active'));
    if (rowEl) rowEl.classList.add('active');

    contentFrame.textContent = '';
    contentFrameTitle.textContent = title;
    contentFrameTitle.title = title;
    contentFrameTitle.classList.remove('placeholder');
    renderSubtitle(song, '');
    setActionLinks(tabFile, midiFile);
    setReaderState('loading', 'Loading tablature…');

    try {
      const response = await fetch('tabs/' + tabFile);
      if (token !== loadToken) return;
      if (!response.ok) throw new Error('File not found');
      const text = await response.text();
      if (token !== loadToken) return;
      contentFrame.textContent = text;
      renderSubtitle(song, detectTuning(text));
    } catch (e) {
      if (token !== loadToken) return;
      contentFrame.textContent = 'Error loading tab: ' + e.message;
    }
    setReaderState('ready');
  }
</script>
